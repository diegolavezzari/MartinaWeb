<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Bolsillo Sano</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- La misma barra que la bienvenida, así parece la misma app -->
    <div class="barra-superior">
        <p class="logo">Bolsillo $ano</p>
    </div>

    <div class="login">
        <div class="login-card">

            <div class="login-logo">
                <h1>Ingresá a tu cuenta</h1>
                <p>Controlá tus gastos, cumplí tus metas</p>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <button type="button" id="btn-ingresar" class="boton">Ingresar</button>

            <!-- Vacío: el JS escribe acá si falta algún dato -->
            <p id="mensaje"></p>

            <div class="login-links">
                <p>¿No tenés cuenta? <a href="registro.html">Crear cuenta</a></p>
                <a href="index.html">← Volver</a>
            </div>

        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
