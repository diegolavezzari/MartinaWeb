<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Bolsillo Sano</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- La misma barra que la bienvenida y el login -->
    <div class="barra-superior">
        <p class="logo">Bolsillo $ano</p>
    </div>

    <!-- Reutiliza las clases del login: misma tarjeta, mismos campos -->
    <div class="login">
        <div class="login-card">

            <div class="login-logo">
                <h1>Creá tu cuenta</h1>
                <p>Empezá a cuidar tus ahorros</p>
            </div>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Martina">
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>

            <div class="campo">
                <label for="confirmar">Repetí la contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="••••••••">
            </div>

            <button type="button" id="btn-crear" class="boton">Crear cuenta</button>

            <!-- Vacío: el JS escribe acá si algo está mal -->
            <p id="mensaje"></p>

            <div class="login-links">
                <p>¿Ya tenés cuenta? <a href="login.html">Ingresar</a></p>
                <a href="index.html">← Volver</a>
            </div>

        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
